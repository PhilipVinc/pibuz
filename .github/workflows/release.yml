# pibuz standalone release.
#
# This is the only workflow that publishes anything:
#   - triggers on `v*` tags (`v2.1.0`);
#   - releases ONLY from `main`: the `guard` job refuses a tag whose commit is
#     not an ancestor of main, so a tag pushed on a topic branch fails loudly
#     instead of publishing a release nobody can reproduce from the trunk;
#   - builds the pibuz binary and ships a stable asset shape consumers pin
#     against: pibuz-<version>-linux-<arch>.tar.gz containing
#     pibuz-<version>-linux-<arch>/pibuz, with a .sha256 beside it;
#   - publishes a PRERELEASE GitHub Release on the tag.
#
# Tag `v2.1.0` -> version `2.1.0`. Plain semver: no distro suffixes.

name: release

# One tag shape: `v<X.Y.Z>`, plain semver, matching Cargo.toml. (Before 2.4.0
# the trigger said `v*` while the publish job required a `qbzd-v*` ref, which
# no tag could satisfy at once — so every tag built and none released. The
# `qbzd-v<version>.moodeN` series that did publish is retired: a moOde build is
# just a release now.)
on:
  push:
    tags:
      - "v*"
  # Dispatch builds whatever ref you pick, at its Cargo.toml version, and
  # publishes nothing (the release job needs a tag ref). There is deliberately
  # no version input: it never checked the named tag out, it only relabelled
  # the build, which is how you get a tarball whose name and contents disagree.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Releases are cut from main, and only from main. A release tag anywhere
  # else (a topic branch, a detached build) stops here before anything is
  # built or published. workflow_dispatch without a tag is a plain test build
  # and is exempt — it publishes nothing.
  guard:
    name: tag must be on main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify the tagged commit is on main
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "Not a tag ref ($REF_NAME) — nothing to publish, skipping the check."
            exit 0
          fi
          # No --depth: the checkout above already has full history
          # (fetch-depth: 0), and `git fetch --depth=0` is not "no limit", it is
          # an error — "fatal: depth 0 is not a positive number". This job died
          # on that line for every tag ever pushed, which is half of why no
          # release was ever published.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Tag $REF_NAME points at $GITHUB_SHA, which is not an ancestor of main. Merge to main first, then tag."
            exit 1
          fi
          echo "$REF_NAME ($GITHUB_SHA) is on main."

  build:
    needs: guard
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04-arm
            arch: aarch64
          - runner: ubuntu-22.04
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: release
        run: |
          set -euo pipefail
          VERSION="$(awk '/^\[workspace\.package\]/{f=1; next} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          [ -n "$VERSION" ] || { echo "::error::no [workspace.package] version in Cargo.toml"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The binary reports its Cargo version, and the tarball is named after the
      # tag, so a tag that disagrees with Cargo.toml ships an asset whose name
      # and contents differ. CONTRIBUTING has always told you to "tag what
      # Cargo.toml already says"; nothing checked it, and the retired moOde tag
      # series drifted a whole minor version doing exactly that.
      - name: tag must agree with Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "tag:        $TAG"
          echo "Cargo.toml: $VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag says $TAG, Cargo.toml says $VERSION — run scripts/bump-version.sh and tag what it sets"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev libdbus-1-dev libssl-dev

      # pibuz must never resolve Slint.
      - name: slint-free dep-graph gate
        run: |
          set -euo pipefail
          hits=$(cargo tree -p pibuz -e normal \
                 | grep -E '\bslint[a-z-]* v' || true)
          [ -z "$hits" ] || { echo "::error::pibuz graph resolves Slint:"; echo "$hits"; exit 1; }

      # No PIBUZ_BUILD_ID here. It exists so a build can report a version
      # Cargo.toml cannot hold, and it used to carry the `.moodeN` suffix; with
      # that retired and the tag pinned to Cargo.toml above, stamping would set
      # the value `CARGO_PKG_VERSION` already has. `scripts/pibuz-to-pi.sh`
      # still uses it, for the one case that is genuinely unrepresentable:
      # `2.4.0.local-<sha>-dirty` on a Pi built straight from a working tree.
      - name: build
        run: cargo build --release -p pibuz

      # Empirical gate: the binary must run on glibc 2.35
      # boxes (Ubuntu 22.04 / Bookworm-era moOde images).
      - name: glibc floor gate (objdump)
        run: |
          set -euo pipefail
          floor=$(objdump -T target/release/pibuz \
                  | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1)
          echo "glibc floor: $floor"
          highest=$(printf '%s\n' "$floor" "GLIBC_2.35" | sort -V | tail -1)
          [ "$highest" = "GLIBC_2.35" ] || { echo "::error::floor $floor exceeds 2.35"; exit 1; }

      # Release asset shape. Consumers pin this, so changing it is a breaking
      # change for them: pibuz-<version>-linux-<arch>.tar.gz unpacking to a
      # single versioned directory holding the binary, its unit file, shell
      # completions and a README.
      - name: tarball
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cp target/release/pibuz ./pibuz
          DIR="pibuz-${VERSION}-linux-${ARCH}"
          mkdir -p "staging/${DIR}/completions"
          cp pibuz "staging/${DIR}/pibuz"
          chmod +x "staging/${DIR}/pibuz"
          cp crates/pibuz/service/pibuz.service "staging/${DIR}/pibuz.service"
          ./pibuz completions bash > "staging/${DIR}/completions/pibuz.bash"
          ./pibuz completions zsh  > "staging/${DIR}/completions/pibuz.zsh"
          ./pibuz completions fish > "staging/${DIR}/completions/pibuz.fish"
          cp packaging/linux/pibuz-standalone-README.md "staging/${DIR}/README.md"
          mkdir -p dist
          tar -czf "dist/${DIR}.tar.gz" -C staging "${DIR}"
          ( cd dist && sha256sum "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256" )
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: pibuz-${{ matrix.arch }}
          path: dist/*

  # Single publisher so the two matrix legs never race on Release creation.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pibuz-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: true
          make_latest: false
          body: |
            Pibuz — standalone headless Qobuz Connect daemon.

            Each asset unpacks to `pibuz-<version>-linux-<arch>/` holding the
            `pibuz` binary, `pibuz.service`, shell completions and a README.
            Verify with the `.sha256` beside it.

            Upgrading from a `qbzd` build: the daemon keeps reading an existing
            `~/.config/qbzd` / `~/.local/share/qbzd` profile, so the Connect
            device identity and the audio settings carry over. Point your unit
            file at the new binary name.
