[package]
name = "qbz-cache"
version.workspace = true
edition.workspace = true
description = "Audio caching system for QBZ - L1 memory + L2 disk caches"
authors = ["blitzkriegfc"]
repository.workspace = true
license.workspace = true

[dependencies]
# The L2 cache is sealed at rest; the cipher lives with the rest of the
# crypto (see qbz_cmaf::vault).
qbz-cmaf = { path = "../qbz-cmaf" }

# Logging
log = "0.4"

# Serialization (for stats)
serde = { version = "1", features = ["derive"] }

# File system utilities
dirs = "6"
filetime = "0.2"

[lints]
workspace = true
