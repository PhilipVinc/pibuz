[package]
name = "qbz-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Audio backend system for QBZ - bit-perfect playback"
repository.workspace = true

[dependencies]
qbz-models = { path = "../qbz-models" }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Logging
log = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Audio playback (f32 pipeline is now upstream in rodio 0.22)
rodio = { version = "0.22", features = ["symphonia-all"] }

# Audio analysis
symphonia = { workspace = true }
ebur128 = "0.1"
rustfft = "6.4"
# FFT spectrum helpers for the frontend-agnostic visualizer producer
# (Hann window, log-bar mapping). Kept in lockstep with the src-tauri dep.
spectrum-analyzer = "1.5"

# Database for loudness cache
rusqlite = { version = "0.31", features = ["bundled"] }

# System directories
dirs = "6"

# Lock-free SPSC ring buffer (f32-native) for the JACK feeder -> RT callback
# handoff (#263 Tier 3). f32 elements avoid any byte/alignment handling.
ringbuf = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# ALSA for direct hardware access (bit-perfect)
alsa = "0.11"
# pthread_setschedparam, for putting the ALSA writer thread on SCHED_FIFO.
# See src/rt.rs for why that thread and no other.
libc = "0.2"
# alsa-sys: direct FFI for snd_lib_error_set_handler (custom error routing).
# Kept in lockstep with alsa (0.11 -> alsa-sys 0.4); a single alsa-sys is
# required because of the `links = "alsa"` constraint shared with cpal.
alsa-sys = "0.4"
# zbus for org.freedesktop.ReserveDevice1 D-Bus client (device reservation).
# Pinned to v4 to share the transitive copy already pulled in by
# secret-service/souvlaki and avoid duplicate zbus compiles.
zbus = { version = "4", default-features = false, features = ["tokio"] }
# JACK native backend (#263 Tier 3): QBZ as a first-class JACK client with stable
# ports, for patching into qjackctl / qpwgraph / Reaper. Behind the `jack`
# feature and OFF by default -- see [features] below.
jack = { version = "0.13", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# CoreAudio for device probing, sample rate switching, and (future) hog mode / exclusive mode
coreaudio-rs = "0.14.1"
objc2-core-audio = "0.3.2"

[lints]
workspace = true

[features]
# The JACK output backend, off by default.
#
# JACK is a routing tool: it makes the daemon a patchable client in a graph
# (qjackctl, qpwgraph, Reaper), at the cost of resampling to the graph's one
# fixed rate. Desktop builds want it; a headless bit-perfect endpoint does not,
# and `pibuz` on moOde is exactly that -- ALSA straight to a `hw:` device, no
# JACK server anywhere on the box.
#
# Off by default because the dependency is not free when unused. `jack-sys`'s
# build script runs `pkg_config::find_library("jack").unwrap()` on Linux, so
# merely having it in the graph makes libjack's DEV package a hard build
# requirement -- an extra apt install on every device that compiles pibuz from
# source, for a backend it can never open.
#
# It is also not inert at runtime. The `jack` crate enables `dynamic_loading`
# by default, so nothing links libjack; jack-sys dlopens it on first use,
# through a `lazy_static` whose initialiser is `crate::library().unwrap()`. On
# a box without libjack that is a panic, not the `Err` the player's dispatch is
# written to handle. Compiling the backend out removes the panic path entirely.
jack = ["dep:jack"]
