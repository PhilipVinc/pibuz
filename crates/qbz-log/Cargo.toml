[package]
name = "qbz-log"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Frontend-agnostic logging core for qbz: TeeLogger (stderr+ring+file), write-time secret redaction, and a GitHub-ready diagnostics bundle."

[dependencies]
log = { workspace = true }
# regex-lite, not regex: these are short log lines behind a keyword pre-check,
# and regex-lite builds in a second where regex takes ten.
regex-lite = "0.1"
chrono = { workspace = true }
# Only its RUST_LOG level filter is used; qbz-log formats every line itself.
# Default features would add timestamps (jiff), colors and regex filters.
env_logger = { version = "0.11", default-features = false }
dirs = "5"

[lints]
workspace = true
