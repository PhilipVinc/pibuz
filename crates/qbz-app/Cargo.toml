[package]
name = "qbz-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
qbz-models = { path = "../qbz-models" }
qbz-audio = { path = "../qbz-audio" }
qbz-player = { path = "../qbz-player" }
qbz-qobuz = { path = "../qbz-qobuz" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
log = { workspace = true }
# Only to read the SQLite stores from before settings.toml, once. See
# [features] below.
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
uuid = { version = "1", features = ["v4"] }
thiserror = { workspace = true }
chrono = { workspace = true }

# TLS provider selection
rustls = { version = "0.23", features = ["aws_lc_rs"] }

[lints]
workspace = true

[features]
# Read the SQLite stores from before settings.toml (qconnect_settings.db, and
# audio_settings.db through qbz-audio) once, into it. On by default through
# pibuz; drop it once no install is left that has one.
sqlite-migrate = ["dep:rusqlite", "qbz-audio/sqlite-migrate"]

[dev-dependencies]
# The residency tests drive a real AudioCache.
qbz-cache = { path = "../qbz-cache" }
