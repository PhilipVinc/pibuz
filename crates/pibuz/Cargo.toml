[package]
name = "pibuz"
version.workspace = true
edition.workspace = true
description = "Pibuz — headless Qobuz Connect daemon (daemon + CLI + setup TUI in one binary)"
license.workspace = true
repository.workspace = true

[[bin]]
name = "pibuz"
path = "src/main.rs"

[dependencies]
# workspace crates — the slint-free column ONLY (01-architecture.md §1.2)
qbz-models = { path = "../qbz-models" }
qbz-app = { path = "../qbz-app" }
qbz-core = { path = "../qbz-core" }
qbz-player = { path = "../qbz-player" }
qbz-audio = { path = "../qbz-audio" }          # PROTECTED — read-only consumer
qbz-qobuz = { path = "../qbz-qobuz" }
qbz-media-controls = { path = "../qbz-media-controls" } # MPRIS/media-key control (CONSOLE ext); mpris-server on Linux
qbz-log = { path = "../qbz-log" }
qconnect-core = { path = "../qconnect-core" }
qconnect-protocol = { path = "../qconnect-protocol" }
qconnect-transport-ws = { path = "../qconnect-transport-ws" }
qconnect-app = { path = "../qconnect-app" }
# runtime / wire
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
dirs = "6"
log = { workspace = true }
async-trait = { workspace = true }
# QConnect glue copies (T9) — mirror the desktop copies' direct imports
uuid = { version = "1", features = ["v4"] }                    # renderer-report action uuids
rusqlite = { version = "0.31", features = ["bundled"] }        # daemon-root qconnect_settings.db KV
futures-util = { workspace = true }                            # remote_stream.rs feeder (byte-exact)
# new direct deps (versions already in lock where noted)
tiny_http = "0.12"           # pairing.rs / api HTTP listener
mdns-sd = "0.11"             # pairing.rs mDNS advertisement
toml = "0.9"                 # in lock transitively
libc = "0.2"                 # flock
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
# T13 setup TUI. ratatui 0.30 (NEVER 0.29 — 0.29 pins unicode-width "=0.2.0",
# unresolvable against Slint's annotate-snippets 0.12.16 which needs >=0.2.2;
# ratatui-core 0.30 accepts >=0.2.0,<=0.2.2 → unifies on the lock's 0.2.2, IV5).
# The `crossterm` backend is a DEFAULT feature; re-exported as ratatui::crossterm.
ratatui = "0.30"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

# Debian packaging, read by `cargo deb -p pibuz`.
#
# moOde builds pibuz from source on the device (moode-player/pkgbuild), and
# without this section cargo-deb has nothing to read, so that recipe carried a
# patch that appended it. Keeping it here means the recipe just builds a tag.
#
# Binary only, on purpose: `service/pibuz.service` is NOT shipped. moOde starts
# and stops the daemon itself from renderer.php, the same way it drives
# librespot, and a unit file installed next to that would be a second owner of
# the process. Distros packaging pibuz standalone want the unit and should add
# it in their own packaging rather than have it appear here.
#
# `$auto` resolves the runtime deps from what the binary actually links:
# libasound2 and libjack-jackd2-0 (jack-sys), plus libc/libgcc. No TLS or D-Bus
# runtime dep — rustls and zbus are pure Rust.
[package.metadata.deb]
maintainer = "Filippo Vicentini <filippovicentini@gmail.com>"
copyright = "2024 blitzkriegfc, 2026 Filippo Vicentini, MIT"
section = "sound"
priority = "optional"
extended-description = "Headless Qobuz Connect renderer: a playback daemon, a local control API and a CLI in one binary. None of the desktop GUI stack is linked."
depends = "$auto"
assets = [
    ["target/release/pibuz", "usr/bin/", "755"],
]
