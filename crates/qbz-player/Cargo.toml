[package]
name = "qbz-player"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Playback engine and queue management for QBZ"
repository.workspace = true

[dependencies]
qbz-models = { path = "../qbz-models" }
qbz-audio = { path = "../qbz-audio" }

# Lock-free SPSC ring for the decoder -> ALSA-writer handoff. Same crate and
# same idiom the JACK feeder already uses in qbz-audio; see player/playback_engine.rs.
ringbuf = "0.4"
qbz-qobuz = { path = "../qbz-qobuz" }
qbz-cmaf = { path = "../qbz-cmaf" }
qbz-dsd = { path = "../qbz-dsd" }
qbz-cache = { path = "../qbz-cache" }

# Serialization
serde = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
tokio-stream = { workspace = true }

# Logging
log = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Random (for shuffle)
rand = "0.9"

# Audio decoding
symphonia = { workspace = true }

# Audio playback
rodio = { version = "0.22", features = ["symphonia-all"] }

# HTTP client for streaming
reqwest = { workspace = true }

[lints]
workspace = true
