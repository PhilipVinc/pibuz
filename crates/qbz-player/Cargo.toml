[package]
name = "qbz-player"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Playback engine and queue management for QBZ"
repository.workspace = true

[dependencies]
qbz-models = { path = "../qbz-models" }
qbz-audio = { path = "../qbz-audio" }

# Lock-free SPSC ring for the decoder -> ALSA-writer handoff. Same crate and
# same idiom the JACK feeder already uses in qbz-audio; see player/playback_engine.rs.
ringbuf = "0.4"
qbz-qobuz = { path = "../qbz-qobuz" }
qbz-cmaf = { path = "../qbz-cmaf" }
qbz-cache = { path = "../qbz-cache" }

# Serialization
serde = { workspace = true }

# Async
tokio = { workspace = true }
tokio-util = { workspace = true }

# Logging
log = { workspace = true }

# Random (for shuffle)
rand = "0.9"

# Audio decoding
symphonia = { workspace = true }

# Audio playback
# Output (cpal) and the FLAC/MP3 decoders, nothing else: no recording, no
# dither noise, no MP4/Vorbis/WAV.
rodio = { version = "0.22", default-features = false, features = ["playback", "flac", "mp3"] }

# HTTP client for streaming
reqwest = { workspace = true }
# The body type of a CMAF segment fetch (`cmaf_fetch`); already in the tree via reqwest.
bytes = "1"

[lints]
workspace = true

[dev-dependencies]
# The CDN client needs a process-level CryptoProvider; `cmaf_fetch` tests build one.
rustls = { version = "0.23", features = ["aws_lc_rs"] }
# The decoder tests synthesize a WAV ramp (streaming_source::ramp_wav). Test
# builds only: release builds decode FLAC and MP3 and nothing else.
symphonia = { workspace = true, features = ["wav", "pcm"] }
rodio = { version = "0.22", default-features = false, features = ["playback", "flac", "mp3", "wav"] }
