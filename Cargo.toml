[workspace]
resolver = "2"

members = [
    "crates/qbz-app",
    "crates/qbz-models",
    "crates/qbz-audio",
    "crates/qbz-player",
    "crates/qbz-qobuz",
    "crates/qbz-cache",
    "crates/qbz-cmaf",
    "crates/qconnect-core",
    "crates/qconnect-protocol",
    "crates/qconnect-transport-ws",
    "crates/qconnect-app",
    "crates/qbz-log",
    "crates/pibuz",
]

[workspace.package]
version = "2.7.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/PhilipVinc/pibuz"

# Lints applied to every crate (each member opts in with `[lints] workspace = true`).
# CI runs clippy with `-D warnings`, so every "warn" here fails the build.
[workspace.lints.rust]
# Edition 2024's default: an unsafe operation inside an `unsafe fn` still needs
# its own `unsafe {}` block, and so its own SAFETY comment.
unsafe_op_in_unsafe_fn = "warn"
# A `pub` item no other crate can reach should say `pub(crate)`. Only then does
# the dead-code lint see it, which `pub` hides (see CLAUDE.md, "Visibility").
unreachable_pub = "warn"

[workspace.lints.clippy]
# Every `unsafe` block says why it is sound, in a `// SAFETY:` comment.
undocumented_unsafe_blocks = "warn"
# Every `allow` says why, in its own `reason = "..."`: the reason travels with
# the exemption instead of living in a comment that can drift away from it.
allow_attributes_without_reason = "warn"
# Debugging leftovers.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# The wide functions are SQL row builders and playback-engine constructors:
# one parameter per column / per shared handle. Grouping them into structs
# would add a type per call site without making anything safer, and these
# signatures are stable.
too_many_arguments = "allow"
# The complex types are channel and callback tuples at internal boundaries.
# A type alias would name them without simplifying them.
type_complexity = "allow"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
# CancellationToken: how the driver calls off a gapless download it no longer
# wants (`qbz_qobuz::cmaf::download_full_sized`). Already in the tree via reqwest.
tokio-util = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider", "cookies", "stream"] }

# Logging
log = "0.4"
tracing = "0.1"

# Error handling
thiserror = "2"
anyhow = "1"

# Crypto (Qobuz auth)
md-5 = "0.10"
base64 = "0.22"

# Time
chrono = "0.4"

# Audio. Qobuz streams FLAC (format 6, 7, 27) and MP3 (format 5), previews
# included, and nothing else; the other codecs were the desktop app's local
# library. Tests that synthesize WAV add `wav`/`pcm` as a dev-dependency.
symphonia = { version = "0.5", default-features = false, features = ["flac", "mp3"] }

# Random number generation (shuffle / DJ-mix) — mirrors src-tauri pin
rand = "0.10"

# Fuzzy string similarity (track-mix dedup) — mirrors src-tauri pin
strsim = "0.11"

# Note: Linux-specific dependencies (alsa) go in individual crate Cargo.toml files
# because workspace manifests cannot have [target] sections

[profile.release]
# Strip symbol tables from release binaries. Panic backtraces show addresses
# instead of names; the release workflow archives the UNSTRIPPED binary as an
# Actions artifact per tag for offline symbolication.
# Codegen knobs (opt-level / codegen-units / jobs) intentionally stay in the
# workflows' env (CARGO_PROFILE_RELEASE_*) — they are CI-memory tuning, not
# a property of the package.
strip = "symbols"

# Release builds happen ON the Pi (four slow cores, no incremental), so every
# CPU-second here is several on the board. These dependencies do real work but
# none of it is hot — nothing on the audio, decode or download path — so they
# are built for compile speed instead of peak speed. Behaviour is unchanged;
# only how fast cold code runs.
#
# Measured, cold `cargo build --release -p pibuz`, linux/arm64 at 4 CPUs:
# ~350 -> ~285 CPU-seconds, ~1m40 -> ~1m24 wall (two runs each), when the
# list also held zbus, mpris-server and jiff, since removed from the build. Do
# NOT add `aws-lc-sys`: every CDN byte is decrypted through it.
#
# The bundled SQLite, only there to read pre-settings.toml stores once (the
# `sqlite-migrate` feature). Its C compile was 29 s of the build at -O3.
[profile.release.package.libsqlite3-sys]
opt-level = 1
# mDNS responder for pairing, and the CLI's argument parser.
[profile.release.package.mdns-sd]
opt-level = 1
[profile.release.package.clap_builder]
opt-level = 1
